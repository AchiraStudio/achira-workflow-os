<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="v5-cyan-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="v5-amber-spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="v5-dark-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F30" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <filter id="v5-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Hexagonal Shield -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="url(#v5-dark-shield)" stroke="#1F2E47" stroke-width="2.5" />

  <!-- Outer Kinetic Chevron Stream -->
  <path d="M24,32 L50,68 L76,32" stroke="url(#v5-cyan-stream)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#v5-glow)" />

  <!-- Inner Dynamic V Core -->
  <path d="M35,36 L50,58 L65,36" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Signal Node (The Precision Spark) -->
  <polygon points="50,18 55,27 50,36 45,27" fill="url(#v5-amber-spark)" filter="url(#v5-glow)" />

  <!-- Apex Micro Telemetry Accents -->
  <circle cx="24" cy="32" r="3" fill="#00F2FE" />
  <circle cx="76" cy="32" r="3" fill="#00F2FE" />
  <circle cx="50" cy="68" r="3.5" fill="#38BDF8" />
  <circle cx="50" cy="84" r="2" fill="#F59E0B" />
</svg>

